<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header class="topbar">
            <h1>Admin Dashboard</h1>
            <div>
                <button id="profileBtn" class="btn">My Profile</button>
                <button id="logoutBtn" class="btn danger">Logout</button>
            </div>
        </header>

        <section class="card">
            <h2>Welcome, <span id="adminName">...</span></h2>
            <p class="muted">Signed in as <strong id="adminEmail">...</strong> (role: admin)</p>
        </section>

        <section class="card">
            <h2>Registered Users</h2>
            <p class="muted">Manage users directly from this page.</p>
            
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </section>
    </div>

    <script>
        // ✅ I-check kung nakalogin at ADMIN ka
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        
        if (!currentUser) {
            window.location.href = '/login.html';
        } else if (currentUser.role !== 'admin') {
            alert('Access denied — Admin only.');
            window.location.href = '/user.html';
        }

        // ✅ Ipakita ang pangalan at email ng admin
        document.getElementById('adminName').textContent = currentUser.name;
        document.getElementById('adminEmail').textContent = currentUser.email;

        // ✅ LOGOUT BUTTON — gumagana na
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('currentUser'); // Burahin ang session
            window.location.href = '/login.html'; // Pumunta sa login
        });

        // ✅ MY PROFILE BUTTON — gumagana na
        document.getElementById('profileBtn').addEventListener('click', () => {
            window.location.href = `/profile.html?id=${currentUser.id}`;
        });

        // ✅ I-load at ipakita ang listahan ng users
        async function loadUsers() {
            try {
                const res = await fetch('/api/users');
                const users = await res.json();
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';

                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.role}</td>
                        <td>
                            <button class="btn edit-btn" data-id="${user.id}">Edit</button>
                            <button class="btn delete-btn danger" data-id="${user.id}">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

                // ✅ Attach edit/delete handlers
                attachActionHandlers();
            } catch (err) {
                console.error('Failed to load users:', err);
            }
        }

        // ✅ Edit at Delete button actions
        function attachActionHandlers() {
            // Edit — pupunta sa edit page
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const userId = e.target.dataset.id;
                    window.location.href = `/edit-user.html?id=${userId}`;
                });
            });

            // Delete — may confirmation at hindi pwedeng burahin ang sarili
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const userId = parseInt(e.target.dataset.id, 10);
                    
                    // ✅ Block delete own admin account
                    if (userId === currentUser.id) {
                        alert('You cannot delete your own admin account.');
                        return;
                    }

                    if (!confirm('Are you sure you want to delete this user?')) return;

                    try {
                        const res = await fetch(`/api/users/${userId}`, {
                            method: 'DELETE',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-User-Id': currentUser.id // Ipadala ang kasalukuyang user ID
                            }
                        });

                        if (res.status === 403) {
                            alert('You cannot delete your own admin account.');
                            return;
                        }

                        if (res.ok) {
                            alert('User deleted successfully.');
                            loadUsers(); // I-refresh ang listahan
                        } else {
                            alert('Failed to delete user.');
                        }
                    } catch (err) {
                        alert('Error deleting user.');
                    }
                });
            });
        }

        // ✅ I-load ang listahan pagbukas ng pahina
        loadUsers();
    </script>
</body>
</html>
